name: My-GithubActions-Basics
on:
  push:
    branches:
      - master
jobs:
  my_testing: 
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo 'Hello World from Testing job!'
      
  my_deploy: 
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo 'Hello World from Deploy job!'
    

