name: My-GithubActions-Basics

env:
  APPLICATION_NAME   : "MYBXApp"
  DEPLOY_PACKAGE_NAME: "deploy-ver-${{ github.sha }}"

on:
  push:
    branches:
      - main
      
jobs:
  my_testing: 
    runs-on: ubuntu-latest
    steps:
      - name : Print Hello in Testing
        run  : echo 'Hello World from Testing job!'
      - name : Execute few commands
        run  : |
          echo "Hello Message 1"
          echo "Hello Message 2"
          echo "Application name: ${{ env.APPLICATION_NAME }}"
      - name : List current folder
        run: ls -la
      - name : Git clone my repo
        uses : actions/checkout@v1 
      - name : List current folder
        run: ls -la
      
  my_deploy: 
    runs-on: ubuntu-latest
    needs: [ my_testing ]
    env:
      VAR1: "This is Job Level Variable 1"
      VAR2: 12
    steps:
      - name : Print Hello in Deploy
        run  : echo 'Hello World from Deploy job!'
      - name : Print env vars
        run: |
          echo "VAR1 = ${{ env.VAR1 }}"
          echo "VAR2 = ${{ env.VAR2 }}"
          echo "LOCAL_VAR = $LOCAL_VAR"
        env:
          LOCAL_VAR: "This is local variable"
      - name : Printing Deployment package
        run  : |
          echo "Deploy package name: ${{ env.DEPLOY_PACKAGE_NAME }}"
      - name : Let's test some packages if they are here 1
        run  : aws --version
      - name : Let's test some packages if they are here 2
        run  : zip --version
